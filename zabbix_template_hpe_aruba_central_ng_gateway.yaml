  - uuid: 385c21706cac460d972aa60ff6b26bfb
    template: HPE Aruba Central NG - DeviceType Gateway
    name: HPE Aruba Central NG - DeviceType Gateway
    description: Gateway device monitoring through the HPE Aruba Central NG gateway/cache service.
    groups:
    - name: Templates/Network devices
    macros:
    - macro: '{$CENTRAL.GATEWAY.DEVICE.POLL_INTERVAL}'
      value: 5m
    items:
    - uuid: 21f2179436f14f1987e3d139dcfe63b7
      name: Gateway device raw master item
      type: HTTP_AGENT
      key: central.device.raw
      delay: '{$CENTRAL.GATEWAY.DEVICE.POLL_INTERVAL}'
      history: '0'
      trends: '0'
      value_type: TEXT
      description: Master HTTP item used by dependent items. History is disabled
        intentionally.
      url: '{$CENTRAL.GATEWAY.URL}/api/v2/device/{$CENTRAL.DEVICE.KEY}/raw'
      request_method: GET
      timeout: 20s
      status_codes: '200'
      tags:
      - tag: component
        value: gateway
    - uuid: 0012de0bbb08426d84f125b3f82aac59
      name: Gateway device status
      type: DEPENDENT
      key: central.device.status
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.status
      master_item:
        key: central.device.raw
      triggers:
      - uuid: 35f4ab4a7e0841899c69f2206918249a
        expression: last(/HPE Aruba Central NG - DeviceType Gateway/central.device.status)<>"ONLINE"
        name: 'Gateway {HOST.NAME}: not online'
        priority: HIGH
    - uuid: 54b9b45843c340f8a0aa24576802ccec
      name: Gateway firmware
      type: DEPENDENT
      key: central.device.firmware
      value_type: CHAR
      preprocessing:
