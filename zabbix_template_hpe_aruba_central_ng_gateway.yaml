    - uuid: b96552fa06894319b9f3d9db8520048e
      name: Switch interface discovery
      type: DEPENDENT
      key: central.switch.interface.discovery
      delay: '0'
      lifetime: 30d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.data.interfaces
      lld_macro_paths:
      - lld_macro: '{#IF_ID}'
        path: $.id
      - lld_macro: '{#IF_NAME}'
        path: $.name
      - lld_macro: '{#IF_CONNECTOR}'
        path: $.lldConnector
      - lld_macro: '{#IF_UPLINK}'
        path: $.lldUplink
      - lld_macro: '{#IF_NEIGHBOUR}'
        path: $.lldNeighbour
      - lld_macro: '{#IF_TOPOLOGY_TYPE}'
        path: $.lldNeighbourTopologyType
      - lld_macro: '{#IF_TRANSCEIVER_STATUS}'
        path: $.lldTransceiverStatus
      master_item:
        key: central.device.raw
      overrides:
      - name: Enable selected switch interfaces - basic items
        step: '1'
        filter:
          evaltype: AND
          conditions:
          - macro: '{#IF_NAME}'
            value: '{$CENTRAL.SWITCH.INTERFACE.BASIC.MATCHES}'
            operator: MATCHES_REGEX
            formulaid: A
        operations:
        - operationobject: ITEM_PROTOTYPE
          operator: REGEXP
          value: '^Switch interface .*: (status|operational status|speed|neighbour|neighbour topology type|neighbour vendor)$'
          status: ENABLED
      - name: Enable selected switch interfaces - advanced items and triggers
        step: '2'
        filter:
          evaltype: AND
          conditions:
          - macro: '{#IF_NAME}'
            value: '{$CENTRAL.SWITCH.INTERFACE.ADVANCED.MATCHES}'
            operator: MATCHES_REGEX
            formulaid: A
        operations:
        - operationobject: ITEM_PROTOTYPE
          operator: REGEXP
